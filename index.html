<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duša za Milión - Príbehová Pixel 3D Hra</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            background: #111;
            border: 4px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            overflow: hidden;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #0a0518, #2a0845);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ffcc;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
        #dialogue-box {
            position: absolute;
            bottom: 10px;
            left: 50px;
            width: 700px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ff0055;
            padding: 15px;
            border-radius: 5px;
            font-size: 16px;
            color: #ff99cc;
            display: none;
            box-sizing: border-box;
        }
        .controls-hint {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">Stav: <span id="status-text">Úvodná dohoda</span> | Peniaze: <span id="money">0 €</span> | Duša: <span id="soul" style="color:#00ffcc;">Nedotknutá</span></div>
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div id="dialogue-box"></div>
    </div>
    <div class="controls-hint">Ovládanie: Šípky / W, A, S, D na pohyb | MEDZERNÍK na akciu/dialóg</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Herné stavy: 'intro_animation', 'exploration', 'dialogue'
    let gameState = "intro_animation";
    
    // Hráč a démoni
    let player = { x: 100, y: 300, width: 32, height: 48, speed: 3, money: 0, hasSoul: true, color: "#38bdf8" };
    let demons = [
        { x: 600, y: 280, width: 40, height: 60, color: "#ff0033", name: "Azazel" },
        { x: 670, y: 280, width: 40, height: 60, color: "#cc0029", name: "Moloch" }
    ];

    let keys = {};
    let animTimer = 0;
    let introStep = 0;
    
    // Správa pre animáciu/dialóg
    let dialogueText = "Vitaj v temnom svete, človek... Chceš moc a peniaze? Podpíšeme zmluvu.";
    let dialogueQueue = [
        "Demonský gauner Azazel: 'Tu máš svoj milión dolárov v hotovosti. Presne ako sme sa dohodli.'",
        "Hráč: 'Paráda! Konečne budem bohatý a... počkať, čo to robíte s mojim hrudníkom?!'",
        "Demonský gauner Moloch: 'Hahahaha! Tvoja duša je teraz naším majetkom! Zmluva je zmluva.'",
        "*(Cítiš, ako ťa opúšťa životná sila, ale v rukách držíš balík peňazí. Musíš utiecť!)*"
    ];
    let currentDialogueIndex = 0;

    // Sledovanie klávesov
    window.addEventListener("keydown", (e) => {
        keys[e.code] = true;
        if (e.code === "Space") {
            handleSpacePress();
        }
    });
    window.addEventListener("keyup", (e) => {
        keys[e.code] = false;
    });

    function handleSpacePress() {
        if (gameState === "intro_animation") {
            introStep++;
            if (introStep < dialogueQueue.length) {
                dialogueText = dialogueQueue[introStep];
            } else {
                // Koniec intro animácie, prechod do hry
                gameState = "exploration";
                player.money = 1000000;
                player.hasSoul = false;
                document.getElementById("money").innerText = "1 000 000 €";
                document.getElementById("soul").innerText = "UKRADNUTÁ 💀";
                document.getElementById("soul").style.color = "#ff0033";
                document.getElementById("dialogue-box").style.display = "none";
                document.getElementById("status-text").innerText = "Útek z podsvetia / Voľný pohyb";
            }
        }
    }

    // Hlavná slučka hry
    function update() {
        if (gameState === "exploration") {
            // Pohyb hráča
            if (keys["ArrowLeft"] || keys["KeyA"]) player.x -= player.speed;
            if (keys["ArrowRight"] || keys["KeyD"]) player.x += player.speed;
            if (keys["ArrowUp"] || keys["KeyW"]) player.y -= player.speed;
            if (keys["ArrowDown"] || keys["KeyS"]) player.y += player.speed;

            // Ohraničenie mapy
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            if (player.y < 200) player.y = 200;
            if (player.y > canvas.height - player.height - 10) player.y = canvas.height - player.height - 10;
        }
        animTimer += 0.05;
    }

    function drawPixelRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
    }

    function drawCharacter(x, y, color, isDemon, name) {
        // Pixel art 3D štýl postavičky (jednoduché bloky)
        // Hlava
        drawPixelRect(x + 8, y, 16, 16, isDemon ? "#ff3366" : "#ffccaa");
        // Oči
        drawPixelRect(x + 10, y + 4, 3, 3, "#000");
        drawPixelRect(x + 19, y + 4, 3, 3, "#000");
        
        if (isDemon) {
            // Rohy
            drawPixelRect(x + 4, y - 6, 6, 8, "#990011");
            drawPixelRect(x + 22, y - 6, 6, 8, "#990011");
        }

        // Telo / Oblečenie
        drawPixelRect(x + 4, y + 16, 24, 20, color);
        
        // Nohy
        let legOffset = Math.sin(animTimer * 5) * 4;
        if (keys["ArrowLeft"] || keys["ArrowRight"] || keys["KeyA"] || keys["KeyD"]) {
            drawPixelRect(x + 6, y + 36, 8, 12 + legOffset, "#111");
            drawPixelRect(x + 18, y + 36, 8, 12 - legOffset, "#111");
        } else {
            drawPixelRect(x + 6, y + 36, 8, 12, "#111");
            drawPixelRect(x + 18, y + 36, 8, 12, "#111");
        }

        // Meno nad hlavou
        ctx.fillStyle = "#fff";
        ctx.font = "10px 'Courier New'";
        ctx.fillText(name, x - 5, y - 10);
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Pozadie - Podlahová mriežka (Pseudo 3D efekt)
        ctx.strokeStyle = "#1f1035";
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i, 200);
            ctx.lineTo(i - 200, canvas.height);
            ctx.stroke();
        }
        for (let j = 200; j < canvas.height; j += 20) {
            ctx.beginPath();
            ctx.moveTo(0, j);
            ctx.lineTo(canvas.width, j);
            ctx.stroke();
        }

        // Vykreslenie démonov
        demons.forEach(d => {
            drawCharacter(d.x, d.y, d.color, true, d.name);
        });

        // Vykreslenie hráča
        drawCharacter(player.x, player.y, player.color, false, "Bruno (Ty)");

        // Špeciálna intro animácia (vykreslenie efektu kradnutia duše)
        if (gameState === "intro_animation") {
            document.getElementById("dialogue-box").style.display = "block";
            document.getElementById("dialogue-box").innerText = dialogueText + "\n\n[Stlač MEDZERNÍK pre pokračovanie]";
            
            // Svetelný efekt duše počas animácie
            if (introStep >= 2) {
                ctx.fillStyle = "rgba(0, 255, 204, " + (Math.sin(animTimer * 10) * 0.3 + 0.4) + ")";
                ctx.beginPath();
                ctx.arc(player.x + 16, player.y + 20, 30 + Math.sin(animTimer*5)*5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    function gameLoop() {
        update();
        render();
        requestAnimationFrame(gameLoop);
    }

    // Spustenie hry
    gameLoop();
</script>

</body>
</html>
